<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Иллюстрация печатной платы с микроконтроллером">
  <style>
    .trace{fill:none;stroke:#c98b3a;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .pulse{fill:none;stroke:#ffe2a0;stroke-width:4;stroke-linecap:round;stroke-dasharray:16 300;animation:run 2.6s linear infinite}
    .pulse.b{animation-delay:1.1s;animation-duration:3.2s}
    .pulse.c{animation-delay:.5s;animation-duration:2.2s}
    .led{animation:blink 1.6s steps(1) infinite}
    .led.b{animation-delay:.8s}
    .silk{font:600 13px monospace;fill:#e8f5ee;letter-spacing:1px}
    .chipt{font:700 16px monospace;fill:#cfd8d4;letter-spacing:1px}
    .small{font:11px monospace;fill:#9fc7b4}
    @keyframes run{from{stroke-dashoffset:316}to{stroke-dashoffset:0}}
    @keyframes blink{0%{opacity:1}50%{opacity:.15}}
    @media (prefers-reduced-motion: reduce){.pulse,.led{animation:none}}
  </style>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1d5a43"/></pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect x="10" y="10" width="500" height="380" rx="22" fill="#0f3b2c" stroke="#1f6b4f" stroke-width="2"/>
  <rect x="10" y="10" width="500" height="380" rx="22" fill="url(#dots)"/>
  <g fill="#0b1f18" stroke="#d9b46a" stroke-width="3"><circle cx="38" cy="38" r="9"/><circle cx="482" cy="38" r="9"/><circle cx="38" cy="362" r="9"/><circle cx="482" cy="362" r="9"/></g>

  <path class="trace" d="M200 170 H120 V100 H70"/>
  <path class="trace" d="M200 200 H90 V250 H60"/>
  <path class="trace" d="M200 230 H150 V320 H90"/>
  <path class="trace" d="M320 170 H380 V100 H430"/>
  <path class="trace" d="M320 200 H460"/>
  <path class="trace" d="M320 230 H350 V280 H372"/>
  <path class="trace" d="M240 140 V90 H178 V56"/>
  <path class="trace" d="M280 260 V330 H330"/>

  <path class="pulse" d="M200 170 H120 V100 H70"/>
  <path class="pulse b" d="M320 200 H460"/>
  <path class="pulse c" d="M320 230 H350 V280 H372"/>
  <path class="pulse b" d="M240 140 V90 H178 V56"/>
  <path class="pulse c" d="M200 230 H150 V320 H90"/>

  <g fill="#d9b46a">
    <circle cx="70" cy="100" r="6"/><circle cx="60" cy="250" r="6"/><circle cx="90" cy="320" r="6"/>
    <circle cx="430" cy="100" r="6"/><circle cx="460" cy="200" r="6"/><circle cx="330" cy="330" r="6"/>
  </g>

  <g>
    <rect x="200" y="140" width="120" height="120" rx="8" fill="#16191a" stroke="#3a4440" stroke-width="2"/>
    <g fill="#b8bec0">
      <rect x="212" y="130" width="6" height="10"/><rect x="230" y="130" width="6" height="10"/><rect x="248" y="130" width="6" height="10"/><rect x="266" y="130" width="6" height="10"/><rect x="284" y="130" width="6" height="10"/><rect x="302" y="130" width="6" height="10"/>
      <rect x="212" y="260" width="6" height="10"/><rect x="230" y="260" width="6" height="10"/><rect x="248" y="260" width="6" height="10"/><rect x="266" y="260" width="6" height="10"/><rect x="284" y="260" width="6" height="10"/><rect x="302" y="260" width="6" height="10"/>
      <rect x="190" y="152" width="10" height="6"/><rect x="190" y="170" width="10" height="6"/><rect x="190" y="188" width="10" height="6"/><rect x="190" y="206" width="10" height="6"/><rect x="190" y="224" width="10" height="6"/><rect x="190" y="242" width="10" height="6"/>
      <rect x="320" y="152" width="10" height="6"/><rect x="320" y="170" width="10" height="6"/><rect x="320" y="188" width="10" height="6"/><rect x="320" y="206" width="10" height="6"/><rect x="320" y="224" width="10" height="6"/><rect x="320" y="242" width="10" height="6"/>
    </g>
    <circle cx="214" cy="154" r="4" fill="#3a4440"/>
    <text class="chipt" x="260" y="198" text-anchor="middle">STM32</text>
    <text class="small" x="260" y="218" text-anchor="middle">F411 · 100MHz</text>
  </g>

  <g transform="translate(372 250)">
    <rect width="116" height="70" rx="6" fill="#1b1f22" stroke="#8a9396" stroke-width="2"/>
    <rect x="10" y="20" width="58" height="40" rx="3" fill="#2a2f33" stroke="#4d5559"/>
    <path d="M80 14 h24 v8 h-18 v8 h18 v8 h-18 v8 h18" fill="none" stroke="#c98b3a" stroke-width="3"/>
    <text class="small" x="39" y="44" text-anchor="middle" style="fill:#cfd8d4">ESP32</text>
  </g>

  <g filter="url(#glow)">
    <circle class="led" cx="60" cy="150" r="7" fill="#3ddc97"/>
    <circle class="led b" cx="86" cy="150" r="7" fill="#ffb547"/>
  </g>
  <g fill="#0b1f18" stroke="#d9b46a" stroke-width="2">
    <rect x="130" y="40" width="16" height="16"/><rect x="150" y="40" width="16" height="16"/><rect x="170" y="40" width="16" height="16"/><rect x="190" y="40" width="16" height="16"/>
  </g>
  <text class="silk" x="214" y="54">UART</text>
  <text class="silk" x="46" y="178">PWR RUN</text>
  <text class="silk" x="44" y="378">SK-01 rev.A</text>
  <text class="silk" x="360" y="378">made in SPb</text>
</svg>
